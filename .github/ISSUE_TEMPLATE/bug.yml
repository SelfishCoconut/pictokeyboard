name: Bug
description: Existing behavior is wrong
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The actual behavior, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 6a, Android 14"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0 (versionCode 1)"

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Output of `adb logcat` around the failure, if you have it.
      render: text

  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Often
        - Rarely
        - Once
