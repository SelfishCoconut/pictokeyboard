name: Instrumented tests

# Path-filtered so it only fires when app code or build config changes --
# doc-only and workflow-only PRs skip the emulator entirely. This is the
# slowest job in the repo (roughly 8-12 minutes); the filter is what keeps it
# affordable. No schedule: it runs on the change, not on the clock.
on:
  push:
    branches: [main]
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
  pull_request:
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported API and the current target -- the two that actually
        # break. Anything in between rarely surfaces a unique failure.
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # gradle-wrapper.jar is gitignored in this repo (see README),
          # so CI pins Gradle here and invokes `gradle` rather than
          # `./gradlew`, which would not exist after checkout.
          gradle-version: "8.9"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-api${{ matrix.api-level }}
          path: "app/build/reports/androidTests/"
          if-no-files-found: ignore
