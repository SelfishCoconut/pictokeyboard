name: Instrumented tests

# The slowest job in the repo. The two triggers are filtered differently on
# purpose:
#
#   pull_request -- NOT filtered. These jobs are required checks, and a
#     required check that does not run does not report, so GitHub blocks the
#     merge forever waiting for a status that never arrives (shown only as
#     "Expected", never as an error). A docs-only PR would be unmergeable.
#     The cost is real -- the two API levels run concurrently at roughly 3m30s
#     each, so a PR that cannot have broken anything still waits for them --
#     and it is the price of these jobs being allowed to block a merge at all.
#     An unenforceable test is not a gate.
#
#   push to main -- still filtered. Nothing gates on this run, so skipping it
#     for doc-only merges just saves the time.
#
# No schedule: it runs on the change, not on the clock.
on:
  push:
    branches: [main]
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
  pull_request:
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported API and the current target -- the two that actually
        # break. Anything in between rarely surfaces a unique failure.
        #
        # 36 is the new target, for Play's 2026-08-31 floor. 35 stays for now for
        # a reason that is about this repository rather than about Android: the
        # job name is the status check name, so dropping 35 here leaves
        # `emulator (API 35)` required on main and never reported, and a required
        # check that never reports blocks every pull request forever. That is the
        # exact failure #119 spent a day recovering from.
        #
        # To drop it: untick `emulator (API 35)` in Settings > Branches FIRST,
        # then remove it here. In that order, and not in the other one.
        api-level: [26, 35, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-report-api${{ matrix.api-level }}
          path: "app/build/reports/androidTests/"
          if-no-files-found: ignore
