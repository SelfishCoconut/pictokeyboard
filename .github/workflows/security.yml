name: Security

# Event-driven only: every check runs against the diff that could introduce the
# problem. No schedule -- nothing here runs unattended.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact tag: this action publishes only precise
      # versions (v2.3.8, ...) and has no moving `v2` tag, so `@v2`
      # fails to resolve at job setup.
      # No `with:` -- the action already defaults to `--recursive ./`.
      # `--skip-git` was a v1 flag and is rejected by v2.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
