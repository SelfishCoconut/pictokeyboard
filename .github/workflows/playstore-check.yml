name: Play Store compliance

# The automatable half of the play-release checklist. Catches the config-level
# rejections before an upload burns a versionCode or a review cycle. The
# declaration-level checks (Data Safety accuracy, privacy policy content,
# listing assets) are human work -- see the play-release skill.
#
# Deliberately NOT path-filtered, even though it only ever reads the build
# config. This is a required check, and a required check that does not run does
# not report -- GitHub then blocks the merge forever waiting for a status that
# is never coming, with no error, just "Expected". A filter here would brick
# every docs-only PR. The whole job takes about three seconds, so running it
# on changes it cannot possibly care about costs nothing worth saving.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    name: compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run compliance checks
        env:
          # New apps and updates must target 36 from 2026-08-31. Raised ahead of
          # the date rather than on it: the check exists to fail here instead of
          # in the console, and a rejection there costs a versionCode.
          PLAY_TARGET_SDK_FLOOR: "36"
          MODULE: "app"
        run: bash .github/scripts/play-compliance.sh
