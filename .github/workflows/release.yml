name: Release

# Tag-driven. `git tag v1.2.3 && git push --tags` produces a signed AAB + APK
# and a GitHub Release. versionCode is derived from the run number so it always
# increases -- Play permanently rejects a re-used versionCode.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # gradle-wrapper.jar is gitignored in this repo (see README),
          # so CI pins Gradle here and invokes `gradle` rather than
          # `./gradlew`, which would not exist after checkout.
          gradle-version: "8.9"

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret set -- building unsigned." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release
        env:
          # Consumed by the release signingConfig in build.gradle.kts.
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Monotonic across runs; never reused.
          VERSION_CODE: ${{ github.run_number }}
        run: gradle bundleRelease assembleRelease

      - name: Verify signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose \
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk
