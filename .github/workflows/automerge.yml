name: Auto-merge

# Enables GitHub's native auto-merge (squash) on eligible PRs. GitHub then
# merges them once required status checks pass -- this workflow never merges
# anything itself, so branch protection stays authoritative.
#
# Eligible: PRs labeled `automerge`, and Dependabot PRs.
on:
  pull_request:
    types: [opened, labeled, ready_for_review, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: enable auto-merge
    runs-on: ubuntu-latest
    if: >-
      !github.event.pull_request.draft &&
      (contains(github.event.pull_request.labels.*.name, 'automerge') ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --auto "$PR_URL"
