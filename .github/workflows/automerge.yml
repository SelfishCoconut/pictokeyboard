name: Auto-merge

# Enables GitHub's native auto-merge (squash) on every non-draft PR. GitHub then
# merges each one once branch protection is satisfied -- this workflow never
# merges anything itself, so branch protection stays authoritative.
#
# There is no opt-in label. That makes the required-checks list on `main` the
# only thing standing between a green tick and a merge, so it has to be honest:
# a check that is not required cannot block anything, no matter how red it goes.
# Anything added to CI that is meant to gate a merge must also be added to the
# required checks, and must run on EVERY pull request -- see the comments in
# instrumented.yml and playstore-check.yml for why path filters and required
# checks cannot coexist.
#
# Only PRs targeting `main` qualify, because `main` is the only branch with
# required checks. A PR onto any other branch has nothing gating it, so enabling
# auto-merge there means merging on no checks whatsoever -- #15 landed on the #14
# branch in 60 seconds with six jobs still running. Stacked PRs therefore need a
# deliberate human merge, which is the honest outcome rather than a loophole.
#
# The opt-out is draft: mark a PR draft to keep it from landing unattended.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# Auto-merge is enabled with AUTOMERGE_TOKEN, a fine-grained PAT, rather than
# with GITHUB_TOKEN. This is the whole point of the file and not an incidental
# choice: GitHub raises no downstream events for actions taken with
# GITHUB_TOKEN -- the anti-recursion rule that stops a workflow retriggering
# itself -- so a bot-attributed merge landed a commit on `main` and then did
# nothing. No `push` event, so none of the four push-triggered workflows ran
# (#71); no issue closing, so `Closes #n` was parsed, recorded and ignored
# (#64). A PAT makes the merging actor a real identity and both resume.
#
# An earlier attempt blamed #64 on a missing `issues: write` scope. That was a
# permissions hypothesis for what is actually event suppression, and the
# evidence disproved it -- granting the bot the scope to close an issue does
# not help when GitHub never invokes the closing automation at all.
#
# The token needs, on this repository only: contents RW (the merge writes to
# `main`), pull-requests RW (reading mergeable state and enabling auto-merge),
# issues RW (the `Closes #n` handling), workflows RW (PRs here modify
# .github/workflows, and GitHub refuses those writes without it), metadata RO.
# It expires; when it does, every PR fails this job loudly, which is the
# intended failure mode.

# Empty because nothing in this job uses GITHUB_TOKEN any more -- every call is
# authenticated with the PAT below. Left as an explicit `{}` rather than
# deleted, so that adding a step which does need GITHUB_TOKEN has to state what
# it needs instead of inheriting a permissive default.
permissions: {}

jobs:
  enable:
    name: enable auto-merge
    runs-on: ubuntu-latest
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main'
    steps:
      # `synchronize` is in the trigger list above so that a PR opened before
      # this workflow existed picks auto-merge up on its next push, instead of
      # having to be closed and reopened. Re-running on an already-enabled PR
      # is a no-op.
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          # A missing secret arrives as an empty string, and `gh` would report
          # that as a generic authentication failure. Named explicitly, because
          # the two ways this breaks -- never created, or expired -- both look
          # like an auth error and have completely different fixes.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AUTOMERGE_TOKEN is unset or empty. Create a fine-grained PAT (contents RW, pull-requests RW, issues RW, workflows RW on this repo) and store it as the AUTOMERGE_TOKEN secret. Auto-merge is disabled until then."
            exit 1
          fi

          # Conflicts are the one failure that is expected and self-healing:
          # resolving them means pushing, which reruns this job. Tolerated
          # explicitly rather than by ignoring the exit code, so that a real
          # breakage -- a permissions change, an API change -- still fails
          # loudly instead of silently switching auto-merge off repo-wide.
          state=$(gh pr view "$PR_URL" --json mergeable --jq .mergeable)
          if [ "$state" = "CONFLICTING" ]; then
            echo "::warning::Conflicts with the base branch, so auto-merge cannot be enabled yet. Resolve them and push; this job reruns and enables it then."
            exit 0
          fi
          gh pr merge --squash --auto "$PR_URL"
