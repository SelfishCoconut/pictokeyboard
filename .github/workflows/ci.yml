name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Format
        run: ./gradlew spotlessCheck
      - name: Static analysis
        run: ./gradlew detekt
      - name: Android Lint
        run: ./gradlew lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: "app/build/reports/lint-results-*.html"
          if-no-files-found: ignore
      # Here rather than only in the Pages workflow, which runs on push to main
      # -- by then a broken privacy policy or deletion page is already merged.
      # This is `quality`, which is a required check, so it blocks instead.
      - name: Check the site
        run: python3 .github/scripts/check-site.py

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: "app/build/outputs/apk/debug/*.apk"

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: "app/build/reports/tests/testDebugUnitTest"
          if-no-files-found: ignore
