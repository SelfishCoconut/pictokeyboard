name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.2.0
      - name: Format
        run: ./gradlew spotlessCheck
      - name: Static analysis
        run: ./gradlew detekt
      - name: Android Lint
        run: ./gradlew lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: "app/build/reports/lint-results-*.html"
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.2.0
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: "app/build/outputs/apk/debug/*.apk"

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.2.0
      - run: ./gradlew testDebugUnitTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: "app/build/reports/tests/testDebugUnitTest"
          if-no-files-found: ignore

  # The catalogue's row-level security, proved against a real Postgres.
  #
  # This one is not optional and it is not path-filtered. The publishable key
  # ships inside the APK, so these policies are the only thing standing between
  # a stranger and every community board -- and a policy that is never exercised
  # is a policy nobody has read carefully. It runs on every pull request because
  # required checks and path filters cannot coexist here (see automerge.yml).
  #
  # Only the database container starts: pgTAP connects to Postgres directly, so
  # PostgREST, Auth and the rest are dead weight. That is the difference between
  # a fifteen-second job and a four-minute one.
  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned, not `latest`. Resolving `latest` costs an unauthenticated
          # GitHub API call per job, and with two jobs using the CLI that is
          # enough to trip the rate limit -- which is exactly how this job first
          # went red, on a toolchain error rather than anything under test. A
          # pin also means the CLI cannot change under CI without a commit.
          version: 2.111.0
      - name: Start Postgres and apply migrations
        run: >-
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Row-level security tests
        run: supabase test db

  # The account deletion endpoint (#83).
  #
  # Separate from `database` because it needs what that job deliberately leaves
  # out: Auth to mint a real JWT, Kong to route, and the edge runtime to run the
  # function. Keeping them apart is what stops the fifteen-second RLS job
  # becoming a four-minute one.
  #
  # It is worth the four minutes. This is the only endpoint that can destroy a
  # caregiver's account, and the claim under test -- that naming somebody else
  # in the body cannot delete them -- is not something SQL can assert.
  functions:
    name: functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned for the reason given on the database job above.
          version: 2.111.0
      - name: Start Postgres, Auth and the edge runtime
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Account deletion function tests
        run: supabase/tests/functions/delete_account.test.sh
