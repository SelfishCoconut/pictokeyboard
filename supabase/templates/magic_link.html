<!--
  The sign-in email for the web account-deletion page.

  It leads with the six-digit code, because that is what the page asks for. The
  default Supabase template sends only a link -- verified against a local stack,
  where the email arrives with no digits in it at all -- and with that template
  the code box on the deletion page can never be filled. The result is a Play
  compliance route that looks fine and cannot work.

  The link is kept underneath as a fallback for anyone who would rather click,
  but it is deliberately second: the code is the route that needs no redirect
  URL allow-listed and cannot strand someone on a page they did not come from.

  This template must also be set on the hosted project -- see
  docs/owner-setup.md. Config here covers local development and anything
  applied through the CLI; the dashboard is its own copy.
-->
<h2>Your PictoKeyboard sign-in code</h2>

<p>Enter this code on the page you came from:</p>

<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px; margin: 24px 0;">
  {{ .Token }}
</p>

<p>The code expires shortly and can only be used once.</p>

<p style="color: #5b6069; font-size: 14px;">
  Prefer a link? <a href="{{ .ConfirmationURL }}">Sign in here</a> instead.
</p>

<p style="color: #5b6069; font-size: 14px;">
  If you did not ask to sign in, you can ignore this email — nothing has
  changed, and no account has been created.
</p>
